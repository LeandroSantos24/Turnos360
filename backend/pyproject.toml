[project]
name = "turnos360-backend"
version = "0.1.0"
description = "Turnos360 — API (FastAPI + PostgreSQL + Celery)"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic-settings>=2.7",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "redis>=5.2",
    "celery>=5.4",
    "cryptography>=44.0",
    "pyjwt>=2.10",
    "pydantic[email]>=2.10",
    "python-multipart>=0.0.18",
    "httpx>=0.28",
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
# ruff con techo a propósito: cada minor suya suma reglas por defecto y
# encuentra cosas nuevas en código que no cambió. Sin el techo, el CI se
# pone rojo solo el día que sale una versión. Para subirlo: cambiar el
# rango, correr `ruff check` local, arreglar lo que aparezca, y recién ahí
# commitear los dos juntos.
# faker solo lo usa app/seeds.py (datos de demo). En la imagen de producción
# pesaba 26 MB para nada: los presets de rubro que sí necesita el servidor
# viven ahora en app/presets.py, sin dependencias.
dev = ["pytest>=8.3", "httpx>=0.28", "faker>=33.0", "ruff>=0.9,<0.10"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
