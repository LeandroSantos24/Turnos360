# Headers de seguridad del FRONTEND (las páginas que sirve Next).
# La API ya pone los suyos en app/main.py. Se incluye dentro de cada
# `location` porque un add_header en la location anula los del server.

add_header X-Frame-Options        "DENY"                            always;
add_header X-Content-Type-Options "nosniff"                         always;
add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
add_header Permissions-Policy     "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;

# CSP en dos capas.
#
# 1) EFECTIVA, lo que no rompe nada: nadie embebe el sitio (clickjacking),
#    sin plugins, sin <base> inyectado, formularios solo al propio sitio.
add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;

# 2) REPORT-ONLY, la política completa. Next 14 (App Router) inyecta scripts
#    inline para hidratar, y el Pixel de Meta / Google Tag del negocio también
#    son inline: sin nonces (middleware + render dinámico de todo el sitio),
#    script-src necesita 'unsafe-inline'. Se deja en Report-Only para mirar
#    la consola unos días y recién ahí promoverla a efectiva.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' https://connect.facebook.net https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://*.facebook.com https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com; frame-src https://www.google.com https://www.googletagmanager.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
