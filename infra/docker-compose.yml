name: turnos360

x-logs: &logs
  # Sin límite, el log de un contenedor crece hasta llenar el disco del
  # servidor y tira abajo TODO el stack. 3 archivos de 10 MB por servicio
  # son 30 MB: suficiente para diagnosticar, imposible que moleste.
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logs
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-turnos360}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-turnos360}
      POSTGRES_DB: ${POSTGRES_DB:-turnos360}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *logs
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ../backend
    restart: unless-stopped
    logging: *logs
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-turnos360}:${POSTGRES_PASSWORD:-turnos360}@db:5432/${POSTGRES_DB:-turnos360}
      REDIS_URL: redis://redis:6379/0
      ENV: dev
      # Con `${SECRET_KEY}` a secas, levantar el stack sin --env-file deja
      # la clave VACÍA, y el backend arranca igual: recién revienta con un
      # 500 al firmar el primer token ("HMAC key must not be empty"), que
      # no se parece en nada a la causa. Con un default de desarrollo, el
      # olvido no rompe nada. En producción no hay default: el compose de
      # prod exige la variable y ENV=prod hace fail-fast.
      SECRET_KEY: ${SECRET_KEY:-clave-solo-de-desarrollo-no-usar-en-produccion}
      # Encripta las credenciales de MP/WhatsApp/email que guarda cada
      # empresa. Separada de SECRET_KEY a propósito: rotar la firma de los
      # JWT no debe dejar ilegible lo que ya está encriptado en la base.
      # Vacía en dev = se deriva de SECRET_KEY (crypto.py). Si la seteás
      # ahora y ya tenías credenciales guardadas con la derivada, esas filas
      # dejan de desencriptarse: en dev se vuelven a cargar y listo.
      FERNET_KEY: ${FERNET_KEY:-}
      # URLs base (en deploy: el dominio real)
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
      API_BASE_URL: ${API_BASE_URL:-http://localhost:8000}
      # Los lee `python -m app.seeds_minimo` (crear/rotar el super-admin).
      # Sin reenviarlas, adentro del contenedor están vacías siempre y la
      # clave termina siendo la de desarrollo sin que nadie lo decida.
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:-}
      SUPERADMIN_PASS: ${SUPERADMIN_PASS:-}
      # Email saliente (Gmail: contraseña de APLICACIÓN, no la de la cuenta)
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      PRECIO_LISTA_MENSUAL: ${PRECIO_LISTA_MENSUAL:-13900}
      PROMO_ACTIVA: ${PROMO_ACTIVA:-false}
      PRECIO_PROMO_MENSUAL: ${PRECIO_PROMO_MENSUAL:-11900}
      PROMO_ETIQUETA: ${PROMO_ETIQUETA:-Precio de lanzamiento}
      ADMIN_ALERTA_EMAIL: ${ADMIN_ALERTA_EMAIL:-}
      ADMIN_ALERTA_FALLIDOS: ${ADMIN_ALERTA_FALLIDOS:-true}
      ADMIN_ALERTA_EN_DEV: ${ADMIN_ALERTA_EN_DEV:-false}
      ADMIN_ALERTA_GEOLOCALIZAR: ${ADMIN_ALERTA_GEOLOCALIZAR:-true}
      # ── Tus datos de cobro ─────────────────────────────────────────────
      # Se le muestran al dueño en «Mi suscripción» para que te transfiera.
      # SIN ESTO EL CIRCUITO DE TRANSFERENCIA NO EXISTE: la pantalla decide si
      # mostrar «Cómo pagar» mirando si hay CBU o alias, así que con estas
      # variables vacías el botón «Pasar a Pro» avisa que hay que transferir y
      # después no muestra a dónde. Estaban en el .env y no llegaban al
      # contenedor — el .env solo alimenta la sustitución de este archivo, no
      # se copia solo adentro.
      COBRO_CBU: ${COBRO_CBU:-}
      COBRO_ALIAS: ${COBRO_ALIAS:-}
      COBRO_TITULAR: ${COBRO_TITULAR:-}
      COBRO_CUIT: ${COBRO_CUIT:-}
      COBRO_BANCO: ${COBRO_BANCO:-}
      COBRO_WHATSAPP: ${COBRO_WHATSAPP:-}
      # Link de pago de Mercado Pago pegado a mano (el «botón de pago» que
      # se genera desde la cuenta de MP). Es una de las tres formas de que
      # la pantalla de suscripción tenga algo que mostrar; sin ninguna, el
      # dueño ve «hay que pagar» y ningún lugar donde hacerlo.
      COBRO_MP_LINK: ${COBRO_MP_LINK:-}
      # ── Mercado Pago (el TUYO, para cobrar las cuotas del SaaS) ────────
      MP_SAAS_ACCESS_TOKEN: ${MP_SAAS_ACCESS_TOKEN:-}
      MP_FIRMA_MODO: ${MP_FIRMA_MODO:-off}
      MP_WEBHOOK_SECRET: ${MP_WEBHOOK_SECRET:-}
      # ── WhatsApp ───────────────────────────────────────────────────────
      WA_PROVEEDOR: ${WA_PROVEEDOR:-simulado}
      WA_PRECIO_MENSAJE_ARS: ${WA_PRECIO_MENSAJE_ARS:-73}
      WA_WEBHOOK_VERIFY_TOKEN: ${WA_WEBHOOK_VERIFY_TOKEN:-}
      WA_APP_SECRET: ${WA_APP_SECRET:-}
    ports:
      - "8000:8000"
    volumes:
      - ../backend:/app
      # docs/ montado para que el generador del diagrama y su test vean
      # el archivo DE VERDAD. Sin esto, adentro del contenedor no existe
      # ninguna carpeta docs/ y el chequeo no puede controlar nada.
      - ../docs:/docs
      # infra/ y .env.example, por el mismo motivo y para arreglar un agujero
      # que ya se había cobrado un test.
      #
      # Los tests que comparan la grilla contra los defaults del compose
      # calculan la raíz del repo como `parents[2]` del archivo de test. En la
      # máquina eso da la raíz de verdad; ADENTRO DEL CONTENEDOR, donde el
      # backend está montado en /app, da `/` — y ahí no existía ni /infra ni
      # /.env.example. Los tests hacían `if not existe: return` y pasaban en
      # verde sin haber comparado nada. Un test que no puede fallar es peor que
      # no tenerlo: ocupa el lugar del que sí protegía.
      #
      # Montándolos en la raíz, `parents[2]` apunta a los archivos DE VERDAD en
      # los dos lados y los tests comparan lo mismo corran donde corran.
      # Read-only: son de configuración, ningún test tiene por qué escribirlos.
      - ../infra:/infra:ro
      - ../.env.example:/.env.example:ro
      # Las imágenes que sube el negocio. Volumen y no carpeta del código:
      # `../backend:/app` monta el repo encima, así que sin esto los archivos
      # subidos irían a parar al árbol de fuentes.
      - uploads:/app/uploads
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ../backend
    restart: unless-stopped
    logging: *logs
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-turnos360}:${POSTGRES_PASSWORD:-turnos360}@db:5432/${POSTGRES_DB:-turnos360}
      REDIS_URL: redis://redis:6379/0
      ENV: dev
      # Con `${SECRET_KEY}` a secas, levantar el stack sin --env-file deja
      # la clave VACÍA, y el backend arranca igual: recién revienta con un
      # 500 al firmar el primer token ("HMAC key must not be empty"), que
      # no se parece en nada a la causa. Con un default de desarrollo, el
      # olvido no rompe nada. En producción no hay default: el compose de
