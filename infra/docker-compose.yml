name: turnos360

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-turnos360}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-turnos360}
      POSTGRES_DB: ${POSTGRES_DB:-turnos360}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ../backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-turnos360}:${POSTGRES_PASSWORD:-turnos360}@db:5432/${POSTGRES_DB:-turnos360}
      REDIS_URL: redis://redis:6379/0
      ENV: dev
      SECRET_KEY: ${SECRET_KEY}
      # URLs base (en deploy: el dominio real)
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
      API_BASE_URL: ${API_BASE_URL:-http://localhost:8000}
      # Email saliente (Gmail: contraseña de APLICACIÓN, no la de la cuenta)
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      PRECIO_LISTA_MENSUAL: ${PRECIO_LISTA_MENSUAL:-14990}
      PROMO_ACTIVA: ${PROMO_ACTIVA:-false}
      PRECIO_PROMO_MENSUAL: ${PRECIO_PROMO_MENSUAL:-11990}
      PROMO_ETIQUETA: ${PROMO_ETIQUETA:-Precio de lanzamiento}
      ADMIN_ALERTA_EMAIL: ${ADMIN_ALERTA_EMAIL:-}
      ADMIN_ALERTA_FALLIDOS: ${ADMIN_ALERTA_FALLIDOS:-true}
      ADMIN_ALERTA_EN_DEV: ${ADMIN_ALERTA_EN_DEV:-false}
    ports:
      - "8000:8000"
    volumes:
      - ../backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ../backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-turnos360}:${POSTGRES_PASSWORD:-turnos360}@db:5432/${POSTGRES_DB:-turnos360}
      REDIS_URL: redis://redis:6379/0
      ENV: dev
      SECRET_KEY: ${SECRET_KEY}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
      API_BASE_URL: ${API_BASE_URL:-http://localhost:8000}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      PRECIO_LISTA_MENSUAL: ${PRECIO_LISTA_MENSUAL:-14990}
      PROMO_ACTIVA: ${PROMO_ACTIVA:-false}
      PRECIO_PROMO_MENSUAL: ${PRECIO_PROMO_MENSUAL:-11990}
      PROMO_ETIQUETA: ${PROMO_ETIQUETA:-Precio de lanzamiento}
      ADMIN_ALERTA_EMAIL: ${ADMIN_ALERTA_EMAIL:-}
      ADMIN_ALERTA_FALLIDOS: ${ADMIN_ALERTA_FALLIDOS:-true}
      ADMIN_ALERTA_EN_DEV: ${ADMIN_ALERTA_EN_DEV:-false}
    volumes:
      - ../backend:/app
    command: celery -A app.celery_app worker --loglevel=info
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build: ../backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-turnos360}:${POSTGRES_PASSWORD:-turnos360}@db:5432/${POSTGRES_DB:-turnos360}
      REDIS_URL: redis://redis:6379/0
      ENV: dev
      SECRET_KEY: ${SECRET_KEY}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
      API_BASE_URL: ${API_BASE_URL:-http://localhost:8000}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      PRECIO_LISTA_MENSUAL: ${PRECIO_LISTA_MENSUAL:-14990}
      PROMO_ACTIVA: ${PROMO_ACTIVA:-false}
      PRECIO_PROMO_MENSUAL: ${PRECIO_PROMO_MENSUAL:-11990}
      PROMO_ETIQUETA: ${PROMO_ETIQUETA:-Precio de lanzamiento}
      ADMIN_ALERTA_EMAIL: ${ADMIN_ALERTA_EMAIL:-}
      ADMIN_ALERTA_FALLIDOS: ${ADMIN_ALERTA_FALLIDOS:-true}
      ADMIN_ALERTA_EN_DEV: ${ADMIN_ALERTA_EN_DEV:-false}
    volumes:
      - ../backend:/app
    command: celery -A app.celery_app beat --loglevel=info
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      # URL del backend DESDE el contenedor frontend (la usa sitemap.ts, que
      # corre server-side y no puede llegar a "localhost" del host).
      API_URL_INTERNA: http://backend:8000
      WATCHPACK_POLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - ../frontend:/app
      - /app/node_modules
      # .next vive en un volumen de Docker, NO en la carpeta del host.
      # Sin esto, el contenedor (usuario node) y los builds a mano (usuario
      # de Linux) escriben en el MISMO .next y se pisan: el que escribió
      # primero deja archivos que el otro no puede borrar, y Next muere al
      # arrancar con EACCES sobre .next/server/app-paths-manifest.json.
      - /app/.next
    depends_on:
      - backend

volumes:
  pgdata: