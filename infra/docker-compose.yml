      # empresa. Separada de SECRET_KEY a propósito: rotar la firma de los
      # JWT no debe dejar ilegible lo que ya está encriptado en la base.
      # Vacía en dev = se deriva de SECRET_KEY (crypto.py). Si la seteás
      # ahora y ya tenías credenciales guardadas con la derivada, esas filas
      # dejan de desencriptarse: en dev se vuelven a cargar y listo.
      FERNET_KEY: ${FERNET_KEY:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
      API_BASE_URL: ${API_BASE_URL:-http://localhost:8000}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      PRECIO_LISTA_MENSUAL: ${PRECIO_LISTA_MENSUAL:-13900}
      PROMO_ACTIVA: ${PROMO_ACTIVA:-false}
      PRECIO_PROMO_MENSUAL: ${PRECIO_PROMO_MENSUAL:-11900}
      PROMO_ETIQUETA: ${PROMO_ETIQUETA:-Precio de lanzamiento}
      ADMIN_ALERTA_EMAIL: ${ADMIN_ALERTA_EMAIL:-}
      ADMIN_ALERTA_FALLIDOS: ${ADMIN_ALERTA_FALLIDOS:-true}
      ADMIN_ALERTA_EN_DEV: ${ADMIN_ALERTA_EN_DEV:-false}
      ADMIN_ALERTA_GEOLOCALIZAR: ${ADMIN_ALERTA_GEOLOCALIZAR:-true}
      # ── Tus datos de cobro ─────────────────────────────────────────────
