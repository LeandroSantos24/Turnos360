      - ../backend:/app
    command: celery -A app.celery_app beat --loglevel=info
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
    restart: unless-stopped
    logging: *logs
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      # URL del backend DESDE el contenedor frontend (la usa sitemap.ts, que
      # corre server-side y no puede llegar a "localhost" del host).
      API_URL_INTERNA: http://backend:8000
      WATCHPACK_POLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - ../frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  # Celery worker + beat: se activan en E6 (mensajería) y E8 (automatizaciones).
  # worker:
  #   build: ../backend
  #   command: celery -A app.worker worker --loglevel=info
  #   depends_on: [redis, db]
  # beat:
  #   build: ../backend
  #   command: celery -A app.worker beat --loglevel=info
  #   depends_on: [redis]

volumes:
  uploads:
  pgdata: