      # contenedor — el .env solo alimenta la sustitución de este archivo, no
      # se copia solo adentro.
      COBRO_CBU: ${COBRO_CBU:-}
      COBRO_ALIAS: ${COBRO_ALIAS:-}
      COBRO_TITULAR: ${COBRO_TITULAR:-}
      COBRO_CUIT: ${COBRO_CUIT:-}
      COBRO_BANCO: ${COBRO_BANCO:-}
      COBRO_WHATSAPP: ${COBRO_WHATSAPP:-}
      # Link de pago de Mercado Pago pegado a mano (el «botón de pago» que
      # se genera desde la cuenta de MP). Es una de las tres formas de que
      # la pantalla de suscripción tenga algo que mostrar; sin ninguna, el
      # dueño ve «hay que pagar» y ningún lugar donde hacerlo.
      COBRO_MP_LINK: ${COBRO_MP_LINK:-}
      # ── Mercado Pago (el TUYO, para cobrar las cuotas del SaaS) ────────
      MP_SAAS_ACCESS_TOKEN: ${MP_SAAS_ACCESS_TOKEN:-}
      MP_FIRMA_MODO: ${MP_FIRMA_MODO:-off}
      MP_WEBHOOK_SECRET: ${MP_WEBHOOK_SECRET:-}
      # ── WhatsApp ───────────────────────────────────────────────────────
      WA_PROVEEDOR: ${WA_PROVEEDOR:-simulado}
      WA_PRECIO_MENSAJE_ARS: ${WA_PRECIO_MENSAJE_ARS:-73}
      WA_WEBHOOK_VERIFY_TOKEN: ${WA_WEBHOOK_VERIFY_TOKEN:-}
      WA_APP_SECRET: ${WA_APP_SECRET:-}
    volumes:
      - ../backend:/app
    command: celery -A app.celery_app worker --loglevel=info
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build: ../backend
    restart: unless-stopped
    logging: *logs
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-turnos360}:${POSTGRES_PASSWORD:-turnos360}@db:5432/${POSTGRES_DB:-turnos360}
      REDIS_URL: redis://redis:6379/0
      ENV: dev
      # Con `${SECRET_KEY}` a secas, levantar el stack sin --env-file deja
      # la clave VACÍA, y el backend arranca igual: recién revienta con un
      # 500 al firmar el primer token ("HMAC key must not be empty"), que
      # no se parece en nada a la causa. Con un default de desarrollo, el
      # olvido no rompe nada. En producción no hay default: el compose de
      # prod exige la variable y ENV=prod hace fail-fast.
      SECRET_KEY: ${SECRET_KEY:-clave-solo-de-desarrollo-no-usar-en-produccion}
